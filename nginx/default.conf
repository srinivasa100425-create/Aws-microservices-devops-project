server {
    listen 80;
    server_name _;

    location = /users {
        proxy_pass http://user-service:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /products {
        proxy_pass http://product-service:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /orders {
        proxy_pass http://order-service:3003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /health/user {
        proxy_pass http://user-service:3001/health;
    }

    location = /health/product {
        proxy_pass http://product-service:3002/health;
    }

    location = /health/order {
        proxy_pass http://order-service:3003/health;
    }
}
